# Nginx 配置模板
# 放到服务器 /opt/pomosolo-server/nginx.conf

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # 基础安全
    server_tokens off;

    # 限流区域：每个 IP 每秒最多 10 个请求（登录接口单独限制）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;

    # HTTP → 临时用 80，备案后改为 443 + SSL
    server {
        listen 80;
        # 域名备案完成后取消下面注释：
        # listen 443 ssl http2;
        # ssl_certificate     /etc/ssl/certs/pomosolo.pem;
        # ssl_certificate_key /etc/ssl/private/pomosolo.key;

        server_name ___________;   # 域名填这里

        # 客户端最大 body 大小
        client_max_body_size 10m;

        # ===== REST API =====
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 登录接口单独限流（防暴力破解）
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 注册接口同样限流
        location /api/v1/auth/register {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== WebSocket =====
        location /ws {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;   # WebSocket 长连接，24h 超时
            proxy_send_timeout 86400s;
        }

        # ===== 健康检查 =====
        location /health {
            proxy_pass http://127.0.0.1:3000;
        }

        # ===== 自动更新文件（静态） =====
        location /update/ {
            alias /usr/share/nginx/html/update/;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
