name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    name: Test & Coverage
    # 本地自建 runner：托管 windows-latest 排队极不稳定（曾 20+ 分钟不接单），
    # 本地环境工具链齐全（node22 + rust stable），与 build 同机串行、共享同一份缓存
    runs-on: [self-hosted, windows, x64]
    env:
      CARGO_HOME: D:\pomosolo-cache\cargo
      RUSTUP_HOME: D:\pomosolo-cache\rustup
      NPM_CONFIG_CACHE: D:\pomosolo-cache\npm
      CARGO_TARGET_DIR: D:\pomosolo-cache\target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 同 build：本地 runner 的 system32\bash.exe 是 WSL 启动器，dtolnay action 不可用，直接用系统 rustup
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install dependencies
        run: npm ci

      - name: Prepare Tauri resources
        run: node scripts/copy-resources.mjs

      - name: Run Rust tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Run frontend tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build (Windows)
    needs: test
    # 本地自建 runner（d:\actions-runner，更快且不排队）；test/release 仍走托管 runner
    runs-on: [self-hosted, windows, x64]
    # 自建 runner 专用：工具链与缓存全部放 D 盘，避免占 C 盘；
    # CARGO_TARGET_DIR 固定本地 → target 天然增量缓存，不再走 GitHub 缓存服务（免上传/下载）
    env:
      CARGO_HOME: D:\pomosolo-cache\cargo
      RUSTUP_HOME: D:\pomosolo-cache\rustup
      NPM_CONFIG_CACHE: D:\pomosolo-cache\npm
      CARGO_TARGET_DIR: D:\pomosolo-cache\target
    # 仅在 push 到 main/master 或打 tag 时构建安装包，PR 跳过
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 本地 runner 上 system32\bash.exe 是 WSL 启动器，dtolnay/rust-toolchain 用它跑生成的
      # 临时脚本时 Windows 路径反斜杠被吞（No such file or directory），改用系统 rustup 直装：
      # 系统 rustup 代理在 PATH（C:\Users\admin\.cargo\bin），RUSTUP_HOME 已缓存 stable 工具链
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # 无 rust-cache：本地固定 CARGO_TARGET_DIR 即缓存（依赖未变时增量编译，与 GitHub 零缓存往返）

      # CARGO_TARGET_DIR 是共享本地目录，NSIS bundle 只增不清会残留旧版本安装包，
      # 导致 upload-artifact 的 *.exe 通配符把多个版本一起传上去。构建前清空。
      # 注意：不要显式指定 shell（默认即可）——显式 powershell 5.1 会加载 conda
      # 注入的 $PROFILE，conda 初始化失败会导致步骤假失败（exit 1）。
      - name: Clean NSIS bundle dir (shared local cache)
        run: |
          if (Test-Path "$env:CARGO_TARGET_DIR\release\bundle\nsis") {
            Remove-Item "$env:CARGO_TARGET_DIR\release\bundle\nsis\*" -Recurse -Force
          }

      - name: Build installer
        run: npm run build:installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PomoSolo-installer
          # 产物在 CARGO_TARGET_DIR（本地固定缓存目录）下的 bundle，不在 src-tauri/target
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.sig
          retention-days: 30

      # 双推：打 tag 时把安装包 + 签名 + 服务器版 latest.json 一并上传到自建服务器。
      # 本地 runner 能同时连通 GitHub 与服务器（服务器↔GitHub 线路慢/不通），
      # 所以只能从本地构建完同时上服务器和 GitHub。服务器版 latest.json 的 url 指向
      # api.pomogrow.top，与 GitHub 版（url 指向 GitHub CDN）各自独立，签名相同。
      - name: Upload installer to server (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $nsis = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $exe = Join-Path $nsis "PomoSolo_${version}_x64-setup.exe"
          $sig = "${exe}.sig"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path $sig)) { throw "missing $sig" }
          $basename = [System.IO.Path]::GetFileName($exe)
          $signature = (Get-Content $sig -Raw).Trim()
          $notes = ((git log -1 --pretty=%B 2>$null | Out-String).Trim())
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $latest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://api.pomogrow.top/updates/$basename"
                signature = $signature
              }
            }
          }
          $json = $latest | ConvertTo-Json -Depth 6 -Compress
          # 无 BOM 写文件：latest.json 带 BOM 会让 Rust serde_json 解析失败
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $keyPath = Join-Path $env:RUNNER_TEMP "server_key"
          $latestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          [System.IO.File]::WriteAllText($keyPath, $env:SERVER_SSH_KEY, $utf8NoBom)
          [System.IO.File]::WriteAllText($latestPath, $json, $utf8NoBom)
          scp -i "$keyPath" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$exe" "$sig" "$latestPath" "${env:SERVER_USER}@${env:SERVER_HOST}:/home/ubuntu/frontend/updates/"
          Write-Host "Uploaded $basename + .sig + latest.json to server"

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    # 仅在打 tag 时发布 release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: PomoSolo-installer
          path: installer

      - name: Generate latest.json and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${TAG#v}"
          # 按版本号精确匹配，禁止 ls|head -1：残留旧版本安装包会让字典序
          # 排前面的旧 exe 被选中，导致 latest.json 的 url/signature 指向旧版本
          # （v4.5.11 曾因此把 url 指向 4.5.10 的 exe → 自动更新 404）
          EXE="installer/PomoSolo_${VERSION}_x64-setup.exe"
          SIG="installer/PomoSolo_${VERSION}_x64-setup.exe.sig"
          BASENAME=$(basename "$EXE")
          [ -f "$EXE" ] || { echo "missing $EXE"; exit 1; }
          [ -f "$SIG" ] || { echo "missing $SIG"; exit 1; }
          SIGNATURE=$(cat "$SIG")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # 用 GitHub API 取 tag annotation message（比 git for-each-ref 在 shallow clone 下可靠）
          TAG_SHA=$(gh api repos/${{ github.repository }}/git/refs/tags/$TAG --jq '.object.sha')
          TAG_TYPE=$(gh api repos/${{ github.repository }}/git/refs/tags/$TAG --jq '.object.type')
          if [ "$TAG_TYPE" = "tag" ]; then
            # annotated tag，取 tag object 的 message
            NOTES=$(gh api repos/${{ github.repository }}/git/tags/$TAG_SHA --jq '.message')
          else
            # lightweight tag，fallback 用 commit message
            NOTES=$(gh api repos/${{ github.repository }}/git/commits/$TAG_SHA --jq '.commit.message')
          fi
          [ -z "$NOTES" ] && NOTES="PomoSolo $VERSION"
          # release.md（给 GitHub Release body 用，保持原始换行）
          printf '%s' "$NOTES" > release.md
          # latest.json 的 notes 需要转义为单行 JSON 字符串
          NOTES_JSON=$(printf '%s' "$NOTES" | jq -Rs .)
          cat > latest.json <<JSON
          {"version":"$VERSION","notes":$NOTES_JSON,"pub_date":"$PUB_DATE","platforms":{"windows-x86_64":{"url":"https://github.com/liaowenqi123/PomoSolo/releases/download/$TAG/$BASENAME","signature":"$SIGNATURE"}}}
          JSON
          echo "--- latest.json ---"
          cat latest.json
          echo "--- release.md ---"
          cat release.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            latest.json
          body_path: release.md
          draft: false
          prerelease: false
