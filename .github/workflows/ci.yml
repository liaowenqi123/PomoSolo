name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    name: Test & Coverage
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prepare Tauri resources
        run: node scripts/copy-resources.mjs

      - name: Run Rust tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Run frontend tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build (Windows)
    needs: test
    # 本地自建 runner（d:\actions-runner，更快且不排队）；test/release 仍走托管 runner
    runs-on: [self-hosted, windows, x64]
    # 自建 runner 专用：工具链与缓存全部放 D 盘，避免占 C 盘；
    # CARGO_TARGET_DIR 固定本地 → target 天然增量缓存，不再走 GitHub 缓存服务（免上传/下载）
    env:
      CARGO_HOME: D:\pomosolo-cache\cargo
      RUSTUP_HOME: D:\pomosolo-cache\rustup
      NPM_CONFIG_CACHE: D:\pomosolo-cache\npm
      CARGO_TARGET_DIR: D:\pomosolo-cache\target
    # 仅在 push 到 main/master 或打 tag 时构建安装包，PR 跳过
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 无 rust-cache：本地固定 CARGO_TARGET_DIR 即缓存（依赖未变时增量编译，与 GitHub 零缓存往返）

      - name: Build installer
        run: npm run build:installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PomoSolo-installer
          # 产物在 CARGO_TARGET_DIR（本地固定缓存目录）下的 bundle，不在 src-tauri/target
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.sig
          retention-days: 30

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    # 仅在打 tag 时发布 release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: PomoSolo-installer
          path: installer

      - name: Generate latest.json and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          EXE=$(ls installer/*.exe | head -1)
          SIG=$(ls installer/*.sig | head -1)
          BASENAME=$(basename "$EXE")
          VERSION="${TAG#v}"
          SIGNATURE=$(cat "$SIG")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # 用 GitHub API 取 tag annotation message（比 git for-each-ref 在 shallow clone 下可靠）
          TAG_SHA=$(gh api repos/${{ github.repository }}/git/refs/tags/$TAG --jq '.object.sha')
          TAG_TYPE=$(gh api repos/${{ github.repository }}/git/refs/tags/$TAG --jq '.object.type')
          if [ "$TAG_TYPE" = "tag" ]; then
            # annotated tag，取 tag object 的 message
            NOTES=$(gh api repos/${{ github.repository }}/git/tags/$TAG_SHA --jq '.message')
          else
            # lightweight tag，fallback 用 commit message
            NOTES=$(gh api repos/${{ github.repository }}/git/commits/$TAG_SHA --jq '.commit.message')
          fi
          [ -z "$NOTES" ] && NOTES="PomoSolo $VERSION"
          # release.md（给 GitHub Release body 用，保持原始换行）
          printf '%s' "$NOTES" > release.md
          # latest.json 的 notes 需要转义为单行 JSON 字符串
          NOTES_JSON=$(printf '%s' "$NOTES" | jq -Rs .)
          cat > latest.json <<JSON
          {"version":"$VERSION","notes":$NOTES_JSON,"pub_date":"$PUB_DATE","platforms":{"windows-x86_64":{"url":"https://github.com/liaowenqi123/PomoSolo/releases/download/$TAG/$BASENAME","signature":"$SIGNATURE"}}}
          JSON
          echo "--- latest.json ---"
          cat latest.json
          echo "--- release.md ---"
          cat release.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            latest.json
          body_path: release.md
          draft: false
          prerelease: false
