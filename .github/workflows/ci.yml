name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    name: Test & Coverage
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build (Windows)
    needs: test
    runs-on: windows-latest
    # 仅在 push 到 main/master 或打 tag 时构建安装包，PR 跳过
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build installer
        run: npm run build:installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PomoSolo-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          retention-days: 30

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    # 仅在打 tag 时发布 release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: PomoSolo-installer
          path: installer

      - name: Generate latest.json and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          EXE=$(ls installer/*.exe | head -1)
          SIG=$(ls installer/*.sig | head -1)
          BASENAME=$(basename "$EXE")
          VERSION="${TAG#v}"
          SIGNATURE=$(cat "$SIG")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # notes 取 tag message（annotation），fallback 用 tag 名
          NOTES=$(git for-each-ref --format='%(contents:subject)%0A%0A%(contents:body)' "refs/tags/$TAG" | head -c 2000 | tr '\n' ' ' | sed 's/"/\\"/g')
          [ -z "$NOTES" ] && NOTES="PomoSolo $VERSION"
          # latest.json（给 updater endpoint 用）
          cat > latest.json <<JSON
          {"version":"$VERSION","notes":"$NOTES","pub_date":"$PUB_DATE","platforms":{"windows-x86_64":{"url":"https://github.com/liaowenqi123/PomoSolo/releases/download/$TAG/$BASENAME","signature":"$SIGNATURE"}}}
          JSON
          # release.md（给 GitHub Release body 用，保持原始换行）
          git for-each-ref --format='%(contents:subject)%0A%0A%(contents:body)' "refs/tags/$TAG" > release.md
          [ -s release.md ] || echo "PomoSolo $VERSION" > release.md
          echo "--- latest.json ---"
          cat latest.json
          echo "--- release.md ---"
          cat release.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            latest.json
          body_path: release.md
          draft: false
          prerelease: false
