<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟 · 反馈管理后台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f5f5f7; color: #1d1d1f; padding: 20px; max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 4px; color: #ff6b6b; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
    .login-box { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 400px; margin: 60px auto; }
    .login-box h2 { margin-bottom: 16px; font-size: 18px; }
    .login-box input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .login-box button { width: 100%; padding: 10px; background: #ff6b6b; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .login-box button:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-box button:hover:not(:disabled) { background: #ff5252; }
    .error { color: #f44336; font-size: 13px; margin-top: 8px; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar select, .toolbar button { padding: 6px 14px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; cursor: pointer; background: white; }
    .toolbar button:hover { background: #f0f0f0; }
    .btn-primary { background: #ff6b6b !important; color: white !important; border: none !important; }
    .btn-primary:hover { background: #ff5252 !important; }
    .btn-sm { padding: 3px 8px !important; font-size: 11px !important; }
    .card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card-id { color: #ccc; font-size: 11px; }
    .card-time { color: #999; font-size: 11px; }
    .card-content { font-size: 14px; line-height: 1.6; margin-bottom: 8px; color: #333; }
    .card-ft { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
    .badge-0 { background: #e3f2fd; color: #1565c0; }
    .badge-1 { background: #fff3e0; color: #e65100; }
    .badge-2 { background: #e8f5e9; color: #2e7d32; }
    .badge-3 { background: #fce4ec; color: #c62828; }
    .remark-input { border: 1px solid #eee; border-radius: 4px; padding: 4px 6px; font-size: 11px; width: 140px; font-family: inherit; }
    .remark-input:focus { border-color: #ff6b6b; outline: none; }
    .save-ok { color: #4caf50; font-size: 11px; margin-left: 4px; display: none; }
    .count { color: #999; font-size: 13px; margin-left: auto; }
    .loading { text-align: center; color: #bbb; padding: 60px; }
    .empty { text-align: center; color: #ccc; padding: 60px; font-size: 14px; }
  </style>
</head>
<body>
  <form class="login-box" id="loginBox" onsubmit="return false">
    <h2>🔐 管理员登录</h2>
    <input type="text" id="loginUser" placeholder="用户名" required autofocus>
    <input type="password" id="loginPass" placeholder="密码" required>
    <button id="loginBtn" onclick="handleLogin()">登录</button>
    <div class="error" id="loginError"></div>
  </form>

  <div id="mainUI" style="display:none">
    <h1>🍅 反馈管理</h1>
    <div class="subtitle">Supabase 直连 · on-premise admin</div>
    <div class="toolbar">
      <select id="statusFilter" onchange="loadFeedback()">
        <option value="all">全部状态</option>
        <option value="0">🆕 已收到</option>
        <option value="1">⏳ 已采纳(待更新)</option>
        <option value="2">✅ 已采纳(已更新)</option>
        <option value="3">❌ 已拒绝</option>
      </select>
      <button onclick="loadFeedback()">🔄 刷新</button>
      <button class="btn-primary btn-sm" onclick="handleLogout()">退出</button>
      <span class="count" id="feedbackCount"></span>
    </div>
    <div id="feedbackList"></div>
    <div class="empty" id="emptyMsg" style="display:none">暂无反馈</div>
  </div>

<script>
const SUPABASE_URL = 'https://sjexeynibnfqxvwehnxk.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_NtzlEhTWwC4qpSY0DEvQ0Q_ER6yJoTz'
const STATUS_LABELS = ['已收到', '已采纳(待更新)', '已采纳(已更新)', '已拒绝']
const STATUS_CLASSES = ['badge-0', 'badge-1', 'badge-2', 'badge-3']

let supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
let adminUser = null

const loginBtn = document.getElementById('loginBtn')
const loginError = document.getElementById('loginError')

// PBKDF2 with Web Crypto API
async function verifyBrowser(password, storedHashHex, saltHex) {
  const encoder = new TextEncoder()
  const key = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits'])
  const salt = new Uint8Array(saltHex.match(/.{2}/g).map(b => parseInt(b, 16)))
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-512', salt, iterations: 100000 }, key, 512)
  const hashHex = Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('')
  return hashHex === storedHashHex
}

async function handleLogin() {
  loginBtn.disabled = true
  loginBtn.textContent = '验证中...'
  loginError.textContent = ''

  const username = document.getElementById('loginUser').value.trim()
  const password = document.getElementById('loginPass').value

  if (!username || !password) {
    loginError.textContent = '请输入用户名和密码'
    loginBtn.disabled = false
    loginBtn.textContent = '登录'
    return
  }

  try {
    const { data: users, error } = await supabase.from('users')
      .select('*').eq('username', username).single()

    if (error || !users) {
      loginError.textContent = '用户名不存在'
      loginBtn.disabled = false
      loginBtn.textContent = '登录'
      return
    }

    if (!users.admin) {
      loginError.textContent = '非管理员用户，无权访问'
      loginBtn.disabled = false
      loginBtn.textContent = '登录'
      return
    }

    const ok = await verifyBrowser(password, users.password_hash, users.salt)
    if (!ok) {
      loginError.textContent = '密码错误'
      loginBtn.disabled = false
      loginBtn.textContent = '登录'
      return
    }

    adminUser = users
    document.getElementById('loginBox').style.display = 'none'
    document.getElementById('mainUI').style.display = 'block'
    loadFeedback()
  } catch (e) {
    loginError.textContent = '登录异常: ' + e.message
    loginBtn.disabled = false
    loginBtn.textContent = '登录'
  }
}

// 回车登录
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin() })

async function loadFeedback() {
  const list = document.getElementById('feedbackList')
  const empty = document.getElementById('emptyMsg')
  const filter = document.getElementById('statusFilter').value

  list.innerHTML = '<div class="loading">加载中...</div>'

  let q = supabase.from('feedback').select('*').order('create_time', { ascending: false }).limit(100)
  if (filter !== 'all') q = q.eq('feedback_status', parseInt(filter))

  const { data, error } = await q
  if (error) { list.innerHTML = `<div class="error">查询失败: ${error.message}</div>`; return }

  document.getElementById('feedbackCount').textContent = `共 ${data.length} 条`

  if (!data?.length) { list.innerHTML = ''; empty.style.display = 'block'; return }
  empty.style.display = 'none'

  const userIds = [...new Set(data.map(f => f.user_id))]
  const { data: users } = await supabase.from('users').select('id,username').in('id', userIds)
  const userMap = {}; if (users) users.forEach(u => { userMap[u.id] = u.username || `#${u.id}` })

  list.innerHTML = data.map(f => `
    <div class="card">
      <div class="card-hd">
        <span class="card-id">#${f.id}</span>
        <span class="card-time">${fmt(f.create_time)}</span>
      </div>
      <div class="card-content">${esc(f.feedback_content)}</div>
      <div class="card-ft">
        <span style="color:#888">${userMap[f.user_id] || '?'}</span>
        <span class="badge ${STATUS_CLASSES[f.feedback_status]||'badge-0'}">${STATUS_LABELS[f.feedback_status]||'?'}</span>
        <select onchange="updateStatus(${f.id},this.value)" style="font-size:11px;padding:2px 4px;border-radius:4px;border:1px solid #ddd">
          ${[0,1,2,3].map(s => `<option value="${s}" ${f.feedback_status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
        </select>
        <input class="remark-input" id="rm${f.id}" value="${esc(f.remark||'')}" placeholder="备注">
        <button class="btn-sm" onclick="saveRemark(${f.id})" style="background:#eee;border:1px solid #ddd">💾</button>
        <span class="save-ok" id="ok${f.id}">✓</span>
      </div>
    </div>
  `).join('')
}

async function updateStatus(id, s) {
  await supabase.from('feedback').update({ feedback_status: parseInt(s) }).eq('id', id)
  loadFeedback()
}

async function saveRemark(id) {
  await supabase.from('feedback').update({ remark: document.getElementById('rm'+id).value }).eq('id', id)
  const ok = document.getElementById('ok'+id)
  ok.style.display = 'inline'; setTimeout(() => ok.style.display = 'none', 1200)
}

function handleLogout() { adminUser = null; document.getElementById('loginBox').style.display = 'block'; document.getElementById('mainUI').style.display = 'none' }
function fmt(t) { if (!t) return ''; const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` }
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML }
</script>
</body>
</html>
