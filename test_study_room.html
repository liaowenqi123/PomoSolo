<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室按钮测试</title>
  <style>
    body {
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .test-section {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .btn-header {
      padding: 8px 12px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    .btn-header:hover {
      background: #ff5252;
    }
    .study-room-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .study-room-modal.active {
      display: flex;
    }
    .study-room-modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
    }
    .log {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>自习室按钮测试</h1>
  
  <div class="test-section">
    <h2>测试 1: 基础按钮点击</h2>
    <button class="btn-header" id="test-btn-1">测试按钮 1</button>
    <div class="log" id="log-1"></div>
  </div>
  
  <div class="test-section">
    <h2>测试 2: 自习室按钮（模拟）</h2>
    <button class="btn-header" id="ui-study-room-btn" title="自习室">📚 自习室</button>
    <div class="log" id="log-2"></div>
  </div>
  
  <div class="test-section">
    <h2>测试 3: 弹窗显示</h2>
    <button class="btn-header" id="test-modal-btn">打开弹窗</button>
    <div class="log" id="log-3"></div>
  </div>
  
  <!-- 自习室弹窗 -->
  <div class="study-room-modal" id="study-room-modal">
    <div class="study-room-modal-content">
      <h2>📚 自习室</h2>
      <p>这是自习室弹窗内容</p>
      <button class="btn-header" id="close-modal-btn">关闭</button>
    </div>
  </div>
  
  <script>
    // 日志函数
    function log(id, message) {
      const logEl = document.getElementById(id);
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `[${time}] ${message}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }
    
    // 测试 1: 基础按钮
    const testBtn1 = document.getElementById('test-btn-1');
    log('log-1', '按钮元素: ' + (testBtn1 ? '找到' : '未找到'));
    
    if (testBtn1) {
      testBtn1.addEventListener('click', () => {
        log('log-1', '按钮被点击！');
        alert('测试按钮 1 被点击');
      });
      log('log-1', '事件监听器已绑定');
    }
    
    // 测试 2: 自习室按钮
    const studyRoomBtn = document.getElementById('ui-study-room-btn');
    log('log-2', '自习室按钮元素: ' + (studyRoomBtn ? '找到' : '未找到'));
    log('log-2', '按钮显示状态: ' + (studyRoomBtn ? studyRoomBtn.style.display || 'default' : 'N/A'));
    log('log-2', '按钮禁用状态: ' + (studyRoomBtn ? studyRoomBtn.disabled : 'N/A'));
    
    if (studyRoomBtn) {
      studyRoomBtn.addEventListener('click', (e) => {
        log('log-2', '自习室按钮被点击！');
        log('log-2', '事件对象: ' + e.type);
        
        const modal = document.getElementById('study-room-modal');
        if (modal) {
          modal.classList.add('active');
          log('log-2', '弹窗已显示');
        } else {
          log('log-2', '错误: 未找到弹窗元素');
        }
      });
      log('log-2', '事件监听器已绑定');
    }
    
    // 测试 3: 弹窗控制
    const testModalBtn = document.getElementById('test-modal-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const modal = document.getElementById('study-room-modal');
    
    log('log-3', '弹窗元素: ' + (modal ? '找到' : '未找到'));
    
    if (testModalBtn) {
      testModalBtn.addEventListener('click', () => {
        log('log-3', '打开弹窗按钮被点击');
        if (modal) {
          modal.classList.add('active');
          log('log-3', '弹窗已显示');
        }
      });
    }
    
    if (closeModalBtn) {
      closeModalBtn.addEventListener('click', () => {
        log('log-3', '关闭按钮被点击');
        if (modal) {
          modal.classList.remove('active');
          log('log-3', '弹窗已隐藏');
        }
      });
    }
    
    // 点击背景关闭
    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
          log('log-3', '点击背景关闭弹窗');
        }
      });
    }
  </script>
</body>
</html>
