[package]
name = "pomo-solo"
version = "4.6.4"
description = "PomoSolo - 番茄钟应用"
authors = ["liaowenqi123"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pomo_solo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 数据存储
dirs = "5"
# 加密（替代 Electron safeStorage）
aes-gcm = "0.10"
# 密码哈希
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
# HTTP 客户端（替代 axios + DeepSeek API + 更新下载）
reqwest = { version = "0.12", features = ["json", "stream"] }
# Ed25519 签名验证（自实现更新器校验安装包签名）
ed25519-dalek = "2"
# Blake2b-512 预哈希（tauri updater 签名是 Ed25519(blake2b-512(文件))，v4.5.20 修复）
blake2 = "0.10"
# WebSocket 客户端（自习室实时 + 同步听歌）
tokio-tungstenite = "0.24"
futures-util = "0.3"
# 正则表达式（标题/文件名清洗）
regex = "1"
# 机器标识（用于派生加密密钥）
hostname = "0.4"
whoami = "1.5"
# Base64 编解码
base64 = "0.22"
# SHA-512 哈希
sha2 = "0.10"
# 音频播放（替代 Python sounddevice + soundfile）
# rodio 0.21：修复 0.20 的 symphonia MP4 seek panic（#577），默认支持 MP4+AAC
# 播放格式：mp3/wav/flac/vorbis/m4a（symphonia 解码，不依赖系统 ffmpeg）
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis", "mp4"] }
cpal = "0.16"
# 内置 m4a → mp3 转码（不依赖系统 ffmpeg）：
#   symphonia 解码 AAC/MP4（i16 PCM），mp3lame-encoder（libmp3lame，LGPL）编码 MP3
symphonia = { version = "0.5", features = ["aac", "isomp4"] }
mp3lame-encoder = "0.2"
# 自建服务器客户端（reqwest 调 REST API + tokio-tungstenite 走 WebSocket）
# Windows API（前台检测）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
] }
# 进程管理（Python 子进程）
sysinfo = "0.32"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

# 构建速度优化（v4.5.9 起）：旧配置 fat LTO + codegen-units=1 把编译/链接压成单线程，
# 7800X3D 16 线程全闲置，全量构建 30-40 分钟。
# thin LTO 链接可并行 + codegen-units=16 恢复并行 codegen：
# 构建提速数倍，体积略增（~1MB），性能差异 <2%，对发版可接受。
[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
