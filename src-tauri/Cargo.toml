[package]
name = "pomo-solo"
version = "4.0.0"
description = "PomoSolo - 番茄钟应用"
authors = ["liaowenqi123"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pomo_solo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 数据存储
dirs = "5"
# 加密（替代 Electron safeStorage）
aes-gcm = "0.10"
# 密码哈希
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
# HTTP 客户端（替代 axios + DeepSeek API）
reqwest = { version = "0.12", features = ["json"] }
# 机器标识（用于派生加密密钥）
hostname = "0.4"
whoami = "1.5"
# Base64 编解码
base64 = "0.22"
# SHA-512 哈希
sha2 = "0.10"
# Supabase 客户端（用 reqwest 直接调 REST API）
# Windows API（前台检测）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
# 进程管理（Python 子进程）
sysinfo = "0.32"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
